name: YouTubeJPCaptionStudio
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
packages:
  CaptionShared:
    path: ../ios-shared
targets:
  YouTubeJPCaptionStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App.swift
      - path: Views
      - path: Models
      - path: Services
        excludes:
          - YouTubeURL.swift
          - FreqService.swift
          - NLPTagger.swift
          - VocabStyle.swift
          - SubtitleParser.swift
          - DriveAPIClient.swift
          - DriveOAuthConfig.swift
          - DriveAuthService.swift
          - CaptionService.swift
          - SettingsSync.swift
          - SubtitleParserSmoke.swift
      - path: Assets.xcassets
      # Only the injected player script ships in the app — dev tooling (sh/md/plist) must not.
      - path: Scripts/user_script.js
        buildPhase: resources
      - path: Resources/dict.sqlite
        type: file
        buildPhase: resources
      - path: Resources/freq_ja.json
        type: file
        buildPhase: resources
    dependencies:
      - package: CaptionShared
        product: CaptionShared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 44T7Y77WAJ
        CODE_SIGN_IDENTITY: iPhone Developer
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        # Keep this in sync with the committed Info.plist, which ships
        # NSAllowsLocalNetworking only. `xcodegen generate` rewrites Info.plist from
        # these properties, so a broader value here silently disables ATS for the
        # WKWebView that loads YouTube.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.example.YouTubeJPCaptionStudio.drive-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.886146342458-ik5d09sgushl9itr8csk6mj1ordv8ii2
        # Drive OAuth config lives in the bundle, not in Swift source.
        DRIVE_OAUTH_CLIENT_ID: 886146342458-ik5d09sgushl9itr8csk6mj1ordv8ii2.apps.googleusercontent.com
        DRIVE_FOLDER_ID: 1K8LPtKici0gVaq5FuTMDmYDWzPpBokFA
