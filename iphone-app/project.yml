name: YouTubeJPCaptionStudioiPhone
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
packages:
  CaptionShared:
    path: ../ios-shared
schemes:
  YouTubeJPCaptionStudioiPhone:
    build:
      targets:
        YouTubeJPCaptionStudioiPhone: [run]
  YouTubeJPCaptionStudioiPhoneUITests:
    build:
      targets:
        YouTubeJPCaptionStudioiPhone: [run]
        YouTubeJPCaptionStudioiPhoneUITests: [test]
    test:
      targets:
        - name: YouTubeJPCaptionStudioiPhoneUITests
targets:
  YouTubeJPCaptionStudioiPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: ../uitests-shared
    dependencies:
      - target: YouTubeJPCaptionStudioiPhone
  YouTubeJPCaptionStudioiPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App.swift
      - path: Views
        excludes:
          - TokenizedJAView.swift
          - DictPopupView.swift
          - HardsubOverlayView.swift
      - path: Services
        excludes:
          - YouTubeURL.swift
          - FreqService.swift
          - NLPTagger.swift
          - VocabStyle.swift
          - SubtitleParser.swift
          - DriveAPIClient.swift
          - DriveOAuthConfig.swift
          - DriveAuthService.swift
          - CaptionService.swift
          - SettingsSync.swift
          - SubtitleParserSmoke.swift
          - BackupService.swift
          - VocabSync.swift
          - DictionaryService.swift
      - path: Assets.xcassets
      # Scripts/ is dev tooling only (deploy/renew/signing) — nothing ships in the app.
      - path: Resources/dict.sqlite
        type: file
        buildPhase: resources
      - path: Resources/freq_ja.json
        type: file
        buildPhase: resources
    dependencies:
      - package: CaptionShared
        product: CaptionShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.YouTubeJPCaptionStudio.iPhone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 44T7Y77WAJ
        CODE_SIGN_IDENTITY: iPhone Developer
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: JP Caption Studio
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.example.YouTubeJPCaptionStudio.drive-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.886146342458-ik5d09sgushl9itr8csk6mj1ordv8ii2
        # Drive OAuth config lives in the bundle, not in Swift source.
        DRIVE_OAUTH_CLIENT_ID: 886146342458-ik5d09sgushl9itr8csk6mj1ordv8ii2.apps.googleusercontent.com
        DRIVE_FOLDER_ID: 1K8LPtKici0gVaq5FuTMDmYDWzPpBokFA
