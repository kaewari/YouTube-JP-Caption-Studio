name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-test-suite:
    name: bridge-test-suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The ASR DSP tests drive a real ffmpeg filter chain; without the binary
      # decode falls back to plain audio and the DSP assertions fail.
      - name: Install ffmpeg for the ASR DSP tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # The TXT-parse parity test runs the extension's real JS parser in Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: local-bridge/requirements.txt
      - name: Install bridge dependencies
        run: python -m pip install -r requirements.txt
        working-directory: local-bridge
      - name: Build test dictionary database
        run: python app/scripts/build_dict_sqlite.py
        working-directory: local-bridge
      - name: Run bridge tests
        run: python -m pytest -q tests/ -k "not test_live_ja_android and not test_live_en_watch_html"
        working-directory: local-bridge
      - name: Run real bridge HTTP/tokenize integration
        working-directory: local-bridge
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import socket
          import urllib.error
          import urllib.request

          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0))
              port = probe.getsockname()[1]
          health_url = f"http://127.0.0.1:{port}/health"
          server = subprocess.Popen(
              [sys.executable, "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", str(port)],
          )
          try:
              for _ in range(30):
                  if server.poll() is not None:
                      raise RuntimeError(f"uvicorn exited with code {server.returncode}")
                  try:
                      with urllib.request.urlopen(health_url, timeout=2) as response:
                          payload = json.load(response)
                          if response.status != 200 or payload.get("ready") is not True:
                              raise RuntimeError(f"unexpected health response: HTTP {response.status} {payload!r}")
                          if not isinstance(payload.get("models_loaded"), dict):
                              raise RuntimeError(f"health response has no models_loaded object: {payload!r}")
                          print(f"HTTP {response.status} /health; ready=true; models_loaded={payload['models_loaded']}")
                          env = os.environ.copy()
                          env["BRIDGE_URL"] = f"http://127.0.0.1:{port}"
                          subprocess.run([sys.executable, "tests/test_tokenize_import_enrich.py"], env=env, check=True)
                          break
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      raise RuntimeError(f"HTTP {exc.code} {health_url}: {body}") from exc
                  except urllib.error.URLError:
                      time.sleep(1)
              else:
                  raise TimeoutError(f"bridge did not answer {health_url} within 30 seconds")
          finally:
              if server.poll() is None:
                  server.terminate()
                  try:
                      server.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait()
          PY

  root-tests:
    name: root-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        # scripts/slice_gold_audio.py imports scipy at module level, so the
        # root suite cannot even be collected without it.
        run: python -m pip install pytest numpy soundfile "scipy>=1.11.0"
      - name: Run repo-root tests
        run: python -m pytest -q tests/

  extension-tests:
    name: extension-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run extension test suites
        run: |
          set -euo pipefail
          for suite in extension/shared/*_test.js extension/offscreen/audio_capture_test.js extension/sidepanel/sidepanel_pure_test.js extension/background/service_worker_test.js extension/content/content_test.js; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
      - name: Run the anti-fake test gate
        run: node scripts/verify_no_fake_tests.js
      - name: Every freq_ja.json copy must stay identical
        # The bridge ships one copy and each iOS app bundles its own; a rebuilt
        # table that reaches only one surface is silent data drift.
        run: node scripts/verify_freq_ja_parity.js

  sanity-scripts:
    name: sanity-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: local-bridge/requirements.txt
      # The Python sanity scripts drive the real bridge routes (fastapi, uvicorn).
      - name: Install bridge dependencies
        run: python -m pip install -r requirements.txt
        working-directory: local-bridge
      # Every scripts/*sanity* script. A script that needs an external input or a
      # live service exits 77 (skipped) and is reported as skipped, not as passed.
      - name: Run the sanity suite
        run: bash scripts/run_sanity_suite.sh

  extension-popup:
    name: extension-popup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/saved-items
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/saved-items/package-lock.json
      - run: npm ci
      # extension/popup/ is the generated popup the toolbar icon opens. Rebuild it and
      # compare against what is committed: a stale or incomplete export renders a blank
      # Saved Items page, and nothing else in CI looks at it.
      - name: Rebuild the Saved Items popup
        run: npm run build:extension
      - name: Every asset the popup references must exist
        working-directory: .
        run: node scripts/verify_extension_popup.js
      # Deliberately NOT a byte comparison against the committed popup: `next build`
      # embeds a per-build id, so two builds of identical source differ in the HTML and
      # the __next.*.txt payloads (verified). Comparing them would be a flaky gate.

  saved-items-check:
    name: saved-items-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/saved-items
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/saved-items/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Real Chrome over CDP against the committed popup. GitHub's ubuntu images
      # ship google-chrome; when the binary is missing the probe exits 77 and the
      # gate is reported as skipped instead of passing silently.
      - name: Browser self-test (real Chrome, skipped when unavailable)
        working-directory: .
        run: |
          set +e
          node scripts/browser_probe.js --self-test
          code=$?
          set -e
          if [ "$code" -eq 77 ]; then
            echo "::warning::no Chrome binary on this runner - browser self-test skipped"
            exit 0
          fi
          exit "$code"

  ios-build:
    name: ios-build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stage the runtime dictionary placeholder
        # dict.sqlite is runtime data (not in git, see AGENTS.md §8). The apps
        # degrade without it, so an empty placeholder is enough to compile.
        run: |
          mkdir -p ipad-app/Resources iphone-app/Resources
          : > ipad-app/Resources/dict.sqlite
          : > iphone-app/Resources/dict.sqlite
      - name: Build the iPad app
        run: |
          xcodebuild -project ipad-app/YouTubeJPCaptionStudio.xcodeproj \
            -scheme YouTubeJPCaptionStudio \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd-ipad build
      - name: Build the iPhone app
        run: |
          xcodebuild -project iphone-app/YouTubeJPCaptionStudioiPhone.xcodeproj \
            -scheme YouTubeJPCaptionStudioiPhone \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd-iphone build
      # The Swift store self-test (snapshot encode/apply/merge, wipe tombstones)
      # runs headlessly on macOS: the same sources, only the iOS-only folder
      # picker is stripped.
      - name: Run the Swift store self-test
        run: |
          bash scripts/swift_store_smoke.sh ipad-app
          bash scripts/swift_store_smoke.sh iphone-app
