<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Caption</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="sp-header">
      <div class="sp-title-row">
        <strong>YT Caption</strong>
        <span id="sp-status" class="sp-status">…</span>
      </div>
      <div class="sp-actions">
        <button type="button" id="sp-reload" title="Tải lại caption">Reload</button>
        <button type="button" id="sp-add-cue" title="Thêm cue tại playhead">+ Cue</button>
        <button type="button" id="sp-overlay" title="Bật/tắt overlay + side panel">Overlay</button>
        <button type="button" id="sp-clear-mt" title="Xóa EN/VI đã dịch + cache MT (giữ JA)">Xóa dịch</button>
        <button
          type="button"
          id="sp-wipe-script"
          title="Xóa script đã lưu và tải lại caption từ YouTube"
        >
          Xóa sub
        </button>
        <button type="button" id="sp-export" title="Export TXT">Export</button>
        <button type="button" id="sp-import" title="Nhập bản dịch từ file JSON/TXT">Import</button>
        <input type="file" id="sp-import-file" accept=".json,.txt,application/json,text/plain" hidden />
        <button type="button" id="sp-follow" class="sp-follow" title="Cuộn theo timeline" hidden>
          Theo timeline
        </button>
        <button type="button" id="sp-settings" title="Cài đặt">⚙</button>
      </div>
    </header>
    <section id="sp-import-panel" class="sp-import-panel" hidden>
      <div class="sp-import-head">
        <strong>Nhập bản dịch</strong>
        <span id="sp-import-file-label" class="sp-import-file-label"></span>
        <button type="button" id="sp-import-cancel" class="sp-import-cancel" title="Đóng">×</button>
      </div>
      <p class="sp-import-hint">
        Gộp: khớp theo cue id hoặc thời điểm ±0,35s + JA (mặc định chỉ EN/VI).
        Full: thay toàn bộ script (dịch + timeline) và xóa bản lưu cũ.
      </p>
      <label class="sp-import-opt">
        <input type="radio" name="sp-import-mode" value="merge" checked />
        Gộp (partial) — chỉ các mục có trong file
      </label>
      <label class="sp-import-opt">
        <input type="radio" name="sp-import-mode" value="replace" />
        Thay thế (full) — xóa script cũ, ghi đè toàn bộ dịch + timeline từ file
      </label>
      <label class="sp-import-opt" id="sp-import-include-ja-wrap">
        <input type="checkbox" id="sp-import-include-ja" />
        Gồm JA/timeline (chỉ Gộp; Full luôn gồm)
      </label>
      <div class="sp-import-actions">
        <button type="button" id="sp-import-apply">Áp dụng</button>
      </div>
    </section>
    <div id="sp-toast" class="sp-toast" hidden></div>
    <section id="sp-level-drawer" class="sp-level-drawer" hidden>
      <div class="sp-level-drawer-head">
        <h2>Làm nổi bật theo cấp độ</h2>
        <button type="button" id="sp-level-close" class="sp-level-close" title="Đóng">×</button>
      </div>
      <label class="sp-level-master">
        <span class="sp-toggle">
          <input type="checkbox" id="sp-level-enabled" checked />
          <span class="sp-toggle-track"></span>
        </span>
        <span>Bật tô màu theo JLPT</span>
      </label>
      <div class="sp-level-section-head">
        <span>MÀU SẮC CẤP ĐỘ</span>
        <button type="button" id="sp-level-reset" class="sp-level-reset">Đặt lại</button>
      </div>
      <div id="sp-level-rows" class="sp-level-rows"></div>
      <div class="sp-level-preview-wrap">
        <span class="sp-level-preview-label">VĂN BẢN VÍ DỤ:</span>
        <div id="sp-level-preview" class="sp-level-preview"></div>
      </div>
      <a href="#" id="sp-open-popup" class="sp-level-more">Cài đặt khác (popup)…</a>
    </section>
    <div id="sp-empty" class="sp-empty">
      Mở tab YouTube đang phát video, rồi bấm Reload nếu cần.
    </div>
    <div id="sp-list" class="sp-list" hidden></div>
    <!-- Unused: vocab dict paints on the YouTube page via content script. -->
    <aside id="sp-dict" class="sp-dict" hidden></aside>
    <script src="../content/cue_timing.js"></script>
    <script src="../shared/vocab_style.js"></script>
    <script src="../shared/import_parse.js"></script>
    <script src="../shared/romaji_kana.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
