<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Caption</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="sp-toast" class="sp-toast" hidden></div>
    <div id="sp-empty" class="sp-empty">
      Mở tab YouTube / ABEMA / Netflix đang phát video, rồi bấm Reload nếu cần.
    </div>
    <div id="sp-list" class="sp-list" hidden></div>

    <section id="sp-import-panel" class="sp-import-panel" hidden>
      <div class="sp-import-head">
        <strong>Nhập bản dịch</strong>
        <span id="sp-import-file-label" class="sp-import-file-label"></span>
        <button type="button" id="sp-import-cancel" class="sp-import-cancel" title="Đóng">×</button>
      </div>
      <p class="sp-import-hint">
        Gộp: khớp theo cue id hoặc thời điểm ±0,35s + JA (mặc định chỉ EN/VI).
        Full: thay toàn bộ script (dịch + timeline) và xóa bản lưu cũ.
      </p>
      <label class="sp-import-opt">
        <input type="radio" name="sp-import-mode" value="merge" checked />
        Gộp (partial) — chỉ các mục có trong file
      </label>
      <label class="sp-import-opt">
        <input type="radio" name="sp-import-mode" value="replace" />
        Thay thế (full) — xóa script cũ, ghi đè toàn bộ dịch + timeline từ file
      </label>
      <label class="sp-import-opt" id="sp-import-include-ja-wrap">
        <input type="checkbox" id="sp-import-include-ja" />
        Gồm JA/timeline (chỉ Gộp; Full luôn gồm)
      </label>
      <div class="sp-import-actions">
        <button type="button" id="sp-import-apply">Áp dụng</button>
      </div>
    </section>

    <footer class="sp-footer">
      <div class="sp-footer-toolbar">
        <button type="button" id="sp-add-cue" class="sp-footer-btn" title="Thêm cue tại playhead">+ Cue</button>
        <button type="button" id="sp-reload" class="sp-footer-btn" title="Tải lại caption">Reload</button>
        <button type="button" id="sp-overlay" class="sp-footer-btn" title="Bật/tắt overlay trên video">Overlay</button>
        <button type="button" id="sp-follow" class="sp-footer-btn sp-follow" title="Cuộn theo timeline" hidden>▶ Cuộn</button>
        <div class="sp-footer-spacer"></div>
        <button type="button" id="sp-import" class="sp-footer-btn" title="Nhập bản dịch từ file JSON/TXT">Import</button>
        <input type="file" id="sp-import-file" accept=".json,.txt,application/json,text/plain" hidden />
        <button type="button" id="sp-export" class="sp-footer-btn" title="Export TXT">Export</button>
        <button type="button" id="sp-clear-mt" class="sp-footer-btn sp-footer-btn-subtle" title="Xóa EN/VI đã dịch (giữ JA)">Xóa dịch</button>
        <button type="button" id="sp-wipe-script" class="sp-footer-btn sp-footer-btn-subtle" title="Xóa script đã lưu và tải lại từ đầu">Xóa sub</button>
        <button type="button" id="sp-drive-upload" class="sp-footer-btn sp-footer-btn-subtle" title="Upload script lên Drive">☁ Drive</button>
        <button type="button" id="sp-settings" class="sp-footer-btn sp-footer-btn-icon" title="Cài đặt">⚙</button>
      </div>
      <div class="sp-footer-meta" hidden>
        <!-- Hidden elements for state/drive binding compatibility -->
        <span id="sp-status" class="sp-status"></span>
        <button type="button" id="sp-drive-connect" hidden></button>
        <span id="sp-drive-status" class="sp-drive-status" hidden></span>
        <span id="sp-source" class="sp-source" hidden></span>
        <button type="button" id="sp-source-refresh" class="sp-source-refresh" hidden></button>
      </div>
    </footer>

    <!-- Unused: vocab dict paints on the video page via content script. -->
    <aside id="sp-dict" class="sp-dict" hidden></aside>
    <script src="../content/cue_timing.js"></script>
    <script src="../shared/vocab_style.js"></script>
    <script src="../shared/import_parse.js"></script>
    <script src="../shared/romaji_kana.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
