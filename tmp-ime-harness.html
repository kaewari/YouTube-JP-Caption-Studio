<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>JA IME harness</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 640px; }
    textarea { width: 100%; min-height: 80px; font-size: 20px; }
    #result { margin-top: 12px; font-size: 18px; }
    .pass { color: #0a7; font-weight: bold; }
    .fail { color: #c00; font-weight: bold; }
  </style>
</head>
<body>
  <h1>JA IME harness</h1>
  <p>Type <code>ka</code> below. PASS = hiragana <code>か</code> (OS IME or romaji fallback).</p>
  <textarea id="ja" lang="ja-JP" rows="3" spellcheck="false"></textarea>
  <div id="result">Waiting…</div>
  <script src="file:///Users/hoangson/Documents/Translate realtime OCR youtube video/extension/shared/romaji_kana.js"></script>
  <script>
    // Inline copy if file:// blocked for sibling — load via absolute path above;
    // also embed minimal binder matching sidepanel.
  </script>
  <script>
    (async function () {
      const el = document.getElementById("ja");
      const result = document.getElementById("result");
      // Fetch romaji script via http if file src failed
      if (!globalThis.HardsubRomajiKana) {
        try {
          const s = document.createElement("script");
          s.src = "/romaji_kana.js";
          document.head.appendChild(s);
          await new Promise((res, rej) => { s.onload = res; s.onerror = rej; });
        } catch (_) {}
      }
      let composing = false;
      function apply() {
        const api = globalThis.HardsubRomajiKana;
        if (!api?.convertTrailingRomaji || el.dataset.skip === "1") return;
        const next = api.convertTrailingRomaji(el.value, el.selectionStart ?? el.value.length);
        if (!next) return;
        el.dataset.skip = "1";
        el.value = next.value;
        el.setSelectionRange(next.cursor, next.cursor);
        el.dataset.skip = "";
        update();
      }
      function update() {
        const v = el.value;
        const hasHira = /[\u3040-\u309f]/.test(v);
        const onlyLatin = /^[a-zA-Z]*$/.test(v) && v.length > 0;
        if (hasHira) {
          result.className = "pass";
          result.textContent = "PASS: " + JSON.stringify(v);
        } else if (onlyLatin && v.length >= 2) {
          result.className = "fail";
          result.textContent = "FAIL (Latin): " + JSON.stringify(v);
        } else {
          result.textContent = "value=" + JSON.stringify(v);
        }
        document.title = hasHira ? "PASS " + v : "JA IME harness";
      }
      el.addEventListener("compositionstart", () => { composing = true; });
      el.addEventListener("compositionend", () => { composing = false; apply(); update(); });
      el.addEventListener("input", (e) => { if (!composing && !e.isComposing) apply(); update(); });
      el.addEventListener("keyup", (e) => { if (!composing && !e.isComposing) apply(); update(); });
      el.focus();
      // Auto-test: simulate typing ka via InputEvent path
      setTimeout(() => {
        el.value = "";
        el.dispatchEvent(new Event("focus"));
        // Insert k then a like real typing
        el.value = "k";
        el.setSelectionRange(1, 1);
        el.dispatchEvent(new InputEvent("input", { bubbles: true, data: "k", inputType: "insertText" }));
        el.value = "ka";
        el.setSelectionRange(2, 2);
        el.dispatchEvent(new InputEvent("input", { bubbles: true, data: "a", inputType: "insertText" }));
        apply();
        update();
        window.__IME_AUTO = el.value;
      }, 200);
    })();
  </script>
</body>
</html>
